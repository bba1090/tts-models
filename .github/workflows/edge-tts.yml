name: Edge TTS jobs
on:
  push:
    paths: ["tts-jobs/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: edge-tts
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install edge-tts (pinned)
        run: pip install -q "edge-tts==7.3.1"
      - name: Run jobs without a release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in tts-jobs/*.json; do
            name=$(python -c 'import json,sys,re; n=json.load(open(sys.argv[1],encoding="utf-8")).get("name",""); print(n if re.fullmatch(r"[a-z0-9][a-z0-9-]{0,39}",n) else "")' "$f")
            if [ -z "$name" ]; then echo "skip invalid name in $f"; continue; fi
            if gh release view "tts-$name" >/dev/null 2>&1; then echo "done already: $name"; continue; fi
            python scripts/edge_tts_job.py "$f" out
            tar czf "out/$name.tar.gz" -C out "$name"
            gh release create "tts-$name" "out/$name.tar.gz" --title "TTS $name" --notes "Generated by edge-tts 7.3.1"
          done
